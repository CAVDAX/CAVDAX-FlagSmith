services:
  # 1. FalkorDB Graph Engine
  falkordb:
    image: falkordb/falkordb:latest
    container_name: cavdax-falkordb
    restart: unless-stopped
    volumes:
      - falkordb-prod-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. CAVDAX Backend Server & Enclosed MCP Gate
  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    container_name: cavdax-server
    env_file:
      - ../.env
    environment:
      - PORT=3000
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - NODE_ENV=production
      - FLAGSMITH_API_URL=http://flagsmith-api:8000/api/v1
      - FLAGSMITH_ENVIRONMENT_KEY=${FLAGSMITH_ENVIRONMENT_KEY:-}
      - FLAGSMITH_MANAGEMENT_API_KEY=${FLAGSMITH_MANAGEMENT_API_KEY:-}
      - FLAGSMITH_PROJECT_ID=${FLAGSMITH_PROJECT_ID:-}
      - FLAGSMITH_SYNC_INTERVAL_MS=${FLAGSMITH_SYNC_INTERVAL_MS:-30000}
    volumes:
      - server-data:/app/apps/server/data
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  # 3. CAVDAX Porcelain Dark Web HUD
  client:
    build:
      context: ..
      dockerfile: apps/client/Dockerfile
    container_name: cavdax-client
    env_file:
      - ../.env
    restart: unless-stopped

  # 4. Caddy Automatic HTTPS Reverse Proxy
  caddy:
    image: caddy:2-alpine
    container_name: cavdax-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server
      - client

  # 5. Flagsmith PostgreSQL Database (Self-Hosted State Store)
  flagsmith-db:
    image: postgres:15-alpine
    container_name: cavdax-flagsmith-db
    environment:
      POSTGRES_USER: flagsmith
      POSTGRES_PASSWORD: ${FLAGSMITH_DB_PASSWORD:-flagsmith_prod_secure_pass_99}
      POSTGRES_DB: flagsmith
    volumes:
      - flagsmith-db-prod-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagsmith"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 6. Flagsmith API Engine (Self-Hosted Feature Flag Server)
  flagsmith-api:
    image: flagsmith/flagsmith:latest
    container_name: cavdax-flagsmith-api
    environment:
      DATABASE_URL: postgresql://flagsmith:${FLAGSMITH_DB_PASSWORD:-flagsmith_prod_secure_pass_99}@flagsmith-db:5432/flagsmith
      FLAGSMITH_DOMAIN: ${FLAGSMITH_DOMAIN:-cavdax-flagsmith.sahnirmaan.live}
      DJANGO_ALLOWED_HOSTS: "*"
      PORT: 8000
      ENABLE_ADMIN_ACCESS_USER: "True"
      ADMIN_EMAIL: ${FLAGSMITH_ADMIN_EMAIL:-admin@sahnirmaan.live}
      ADMIN_PASSWORD: ${FLAGSMITH_ADMIN_PASSWORD:-cavdax_flagsmith_admin_pass}
      PREVENT_SIGNUP: "False"
    depends_on:
      flagsmith-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  falkordb-prod-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  server-data:
    driver: local
  flagsmith-db-prod-data:
    driver: local
