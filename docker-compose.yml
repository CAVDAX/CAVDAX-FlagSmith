services:
  # 1. FalkorDB Graph Engine (GraphBLAS Sparse Matrix Database)
  falkordb:
    image: falkordb/falkordb:latest
    container_name: cavdax-falkordb
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - falkordb-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. CAVDAX Backend Gateway & Enclosed MCP Gate
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: cavdax-server
    env_file:
      - .env
    environment:
      - PORT=3000
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - NODE_ENV=production
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL:-http://localhost:3001/api/auth/github/callback}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
      - FLAGSMITH_API_URL=${FLAGSMITH_API_URL:-http://flagsmith-api:8000/api/v1}
      - FLAGSMITH_ENVIRONMENT_KEY=${FLAGSMITH_ENVIRONMENT_KEY:-}
      - FLAGSMITH_MANAGEMENT_API_KEY=${FLAGSMITH_MANAGEMENT_API_KEY:-}
      - FLAGSMITH_PROJECT_ID=${FLAGSMITH_PROJECT_ID:-}
      - FLAGSMITH_SYNC_INTERVAL_MS=${FLAGSMITH_SYNC_INTERVAL_MS:-30000}
    ports:
      - "3001:3000"
    volumes:
      - server-data:/app/apps/server/data
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  # 3. CAVDAX Porcelain Dark Web HUD
  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: cavdax-client
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://server:3000
    ports:
      - "5173:5173"
    depends_on:
      - server
    restart: unless-stopped

  # 4. Flagsmith PostgreSQL Database (Self-Hosted State Store)
  flagsmith-db:
    image: postgres:15-alpine
    container_name: cavdax-flagsmith-db
    environment:
      POSTGRES_USER: flagsmith
      POSTGRES_PASSWORD: flagsmith_password
      POSTGRES_DB: flagsmith
    volumes:
      - flagsmith-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagsmith"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 5. Flagsmith API Engine (Self-Hosted Open Source Feature Flag Server)
  flagsmith-api:
    image: flagsmith/flagsmith:latest
    container_name: cavdax-flagsmith-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://flagsmith:flagsmith_password@flagsmith-db:5432/flagsmith
      FLAGSMITH_DOMAIN: localhost:8000
      DJANGO_ALLOWED_HOSTS: "*"
      PORT: 8000
      ENABLE_ADMIN_ACCESS_USER: "True"
      ADMIN_EMAIL: admin@cavdax.local
      ADMIN_PASSWORD: adminpassword123
      PREVENT_SIGNUP: "False"
    depends_on:
      flagsmith-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  falkordb-data:
    driver: local
  server-data:
    driver: local
  flagsmith-db-data:
    driver: local
